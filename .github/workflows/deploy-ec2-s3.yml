name: Semana 2 - Build y Deploy EC2 + S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semana2-deploy-ec2
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compilar Spring Boot
        run: mvn -B -ntp -f backend/pom.xml clean verify
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar las tres imágenes Docker (ARM64 y AMD64)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_BASE: ${{ vars.DOCKER_IMAGE_NAME }}
        run: |
          test -n "$DH_USER" && test -n "$IMAGE_BASE"
      - name: Publicar MySQL
        uses: docker/build-push-action@v6
        with:
          context: ./mysql
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-mysql:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-mysql:${{ github.sha }}
      - name: Publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-backend:${{ github.sha }}
      - name: Publicar Apache y frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apache
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-apache:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-apache:${{ github.sha }}

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sesión de AWS Labs y bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$AWS_SESSION_TOKEN" && test -n "$AWS_DEFAULT_REGION" && test -n "$S3_BUCKET"
          aws sts get-caller-identity --query Arn --output text
          aws s3api head-bucket --bucket "$S3_BUCKET"
      - name: Copiar Compose de despliegue a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/compose.ec2.yml
          target: ~/semana2-tienda
      - name: Desplegar y configurar credenciales temporales AWS Labs
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DOCKER_IMAGE_NAME,IMAGE_TAG,AWS_REGION,S3_BUCKET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          command_timeout: 15m
          script: |
            set -eu
            umask 077
            cd ~/semana2-tienda
            mv deploy/compose.ec2.yml compose.yml
            rmdir deploy 2>/dev/null || true
            # No guardar credenciales dentro del repositorio ni de la imagen.
            printf 'DOCKERHUB_USERNAME=%s\nDOCKER_IMAGE_NAME=%s\nIMAGE_TAG=%s\nAWS_REGION=%s\nS3_BUCKET=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n' \
              "$DOCKERHUB_USERNAME" "$DOCKER_IMAGE_NAME" "$IMAGE_TAG" "$AWS_REGION" "$S3_BUCKET" \
              "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > .env.tmp
            chmod 600 .env.tmp
            mv .env.tmp .env
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            for attempt in $(seq 1 35); do
              if curl -kfsS https://localhost/api/health >/dev/null; then
                echo 'Backend listo por Apache HTTPS'; exit 0
              fi
              sleep 5
            done
            docker compose --env-file .env ps
            docker compose --env-file .env logs --tail=60 app
            exit 1
