spring.application.name=tienda-segura
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tienda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Clave de laboratorio. En producci√≥n debe ir en un secreto/variable de entorno.
app.jwt.secret=${JWT_SECRET:cHJveWVjdG8tdGllbmRhLXNlZ3VyYS1kdW9jLTIwMjYtY2xhdmUtbGFiLXNvbG8tZGVtbw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Bucket privado para im·genes de productos. El SDK usa la cadena de credenciales predeterminada.
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:us-east-1}
# Credenciales temporales AWS Labs, inyectadas por GitHub Actions (nunca literal).
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.session-token=${AWS_SESSION_TOKEN:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
